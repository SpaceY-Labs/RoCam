[project]
name = "training-data-generator"
version = "0.1.0"
description = "Synthetic HDRI-lit cube image generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
generate-data = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
