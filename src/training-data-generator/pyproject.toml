[project]
name = "training-data-generator"
version = "0.1.0"
description = "Synthetic HDRI-lit cube image generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[project.scripts]
generate-data = "training_data_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training_data_generator"]
